name: Manter Supabase ativo

# Faz uma consulta leve ao banco todo dia, para o plano grátis do Supabase
# não pausar o projeto por inatividade (pausa após 7 dias sem uso).
on:
  schedule:
    - cron: '17 12 * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Consulta leve ao banco
        run: |
          curl -fsS \
            -H "apikey: ${SUPABASE_ANON_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_ANON_KEY}" \
            "${SUPABASE_URL}/rest/v1/atendimentos?select=id&limit=1"
